TECH_UNLOCK_STARHOLD_TECHNO_TITLE:0 "§S解锁科技：§!辅助部件 I"
TECH_UNLOCK_STARHOLD_TECHNO_DESC:0 "通过星球基地的辅助模块，为我们的轻巡洋舰增加新的部件。"

TECH_UNLOCK_STAR_FORTRESS_TECHNO_TITLE:0 "§S解锁科技：§!辅助部件 II"
TECH_UNLOCK_STAR_FORTRESS_TECHNO_DESC:0 "通过星球基地的辅助模块，为我们的驱逐舰增加新的部件。"

TECH_UNLOCK_CITADEL_TECHNO_TITLE:0 "§S解锁科技：§!辅助部件 III"
TECH_UNLOCK_CITADEL_TECHNO_DESC:0 "通过星球基地的辅助模块，为我们的重巡洋舰增加新的部件。"

TECH_UNLOCK_CITADEL_UPGRADE_TITLE:0 "§S解锁科技：§!擎天堡改进"
TECH_UNLOCK_CITADEL_UPGRADE_DESC:0 "我们帝国的技术进步令人畏惧，有了星球基地的新改进，它将是一个令人印象深刻的锁定，并为战列舰和泰坦增加新的部件。"

tech_fractal_power:0 "分形反应堆"
tech_fractal_power_desc:0 "反应堆是由附近恒星的引力吸引，使宇宙射线在复杂和分形的难以理解的计算中产生大量的能量，而没有任何噪音。"

TECH_UNLOCK_FRACTAL_POWER_DESC:0 "反应堆是由附近恒星的引力吸引，使宇宙射线在复杂和分形的难以理解的计算中产生大量的能量，而没有任何噪音。"


 TECH_UNLOCK_FRACTAL_POWER_TITLE:0 "§S解锁组件:§! 分形反应堆。\n- 部分隐形。\n- 辅助探测。"

tech_defense_platform_hull_2:0 "钨结构完整性"
tech_defense_platform_hull_2_desc:0 "加固的框架和具有更大冲击吸收能力的护盾保证了防御站的结构完整性，即使在极大压力下也能保持稳固。"

tech_defense_platform_hull_3:0 "石墨烯结构完整性"
tech_defense_platform_hull_3_desc:0 "加固的框架和具有更大冲击吸收能力的护盾保证了防御力量的结构完整性，即使在极大压力和交叉火力下也能保持稳固。"

tech_ftl_inhibitor_II:0 "高级抑制器"
tech_ftl_inhibitor_II_desc:0 "针对本世纪初敌对帝国的强大高级反击抑制器，有助于抵御敌人的进攻。"

tech_station_large:0 "要塞"
tech_station_large_desc:0 "一座巨大的防御装甲结构，支撑着最激烈的海军攻击。"

tech_solar_panels:0 "太阳能电池板"
tech_solar_panels_desc:0 "利用太阳能产生能量。"
tech_starbase_citadel_upgrade:0 "城堡改进"
tech_starbase_citadel_upgrade_desc:0 "访问城堡星球基地的新建筑，加强帝国的边界限制，促进艺术、贸易或研究。"

tech_gateway_stargate:0 "星际之门"
tech_gateway_stargate_desc:0 "在我们的基地建造新的星际之门，使我们能够创建一个快速的交通网络，这可能会彻底改变星际旅行。"

gateway_stargate_title:0 "星际之门建设"
gateway_stargate_desc:0 "它使我们能够在基地建造星际之门，并在我们的边界内创建一个银河网络。"

whgenevents.6.name:0 "$stargate$ 生成"
whgenevents.6.desc:0 "在§Y[System.GetName]§!的恒星基地中，您已完成了一个§Y$stargate$§! 的创建，它是我们帝国亚空间内部网络的独特且稳定的部分。"


