sbsemp.1_title:0 "电磁脉冲"
sbsemp.1_desc:0 "侦测到压倒性敌对舰队正在进入系统 §Y[event_target:sbsemp_emp.GetName]§!…… 电磁脉冲待命。\n\n第一选项：最大脉冲；将使基地没有防御力，系统内也没有友方或敌方舰队；§H重置时间为360天§!。\n\n第二选项：中等脉冲；将影响到系统内75k至175k范围内的友方或敌方舰队，可能会留下一些可能的次要或主要敌对舰队攻击基地；§H重置时间为180天§!。\n\n第三选项：低脉冲；仅为警告，将禁用 §HP电磁脉冲§!，直到另一个时机。"

tech_emp_sbs:0 "电磁脉冲"
tech_emp_sbs_desc:0 "安装在恒星基地上的电磁脉冲（E.M.P.）用作对抗系统内压倒性敌对舰队的最后防线，具有毁灭性的后果。"


