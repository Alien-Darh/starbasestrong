sm_aux_module:0 "支援模块"
sm_aux_module_desc:0 "战略性地放置在我们边境的后方，具有一定的战术优势的后勤支援站。"

sm_module_protection_link:0 "保护模块"
sm_module_protection_link_desc:0 "一种能够在星系中抵御和延迟某些海盗攻击的站点，直到被捕获前。"

 
 sm_module_protection_link:0 "保护模块"
sm_module_protection_link_desc:0 "一种能够在星系中抵御和延迟海盗攻击的站点，在被捕获之前。"

sm_gun_battery_upgrade:0 "XL炮台"
sm_gun_battery_upgrade_desc:0 "向恒星基地添加两个XL武器空间。"

sm_hydrogen_cells:0 "氢电池"
sm_hydrogen_cells_desc:0 "先进的能量储存设施。"

sm_management_office:0 "管理办公室"
sm_management_office_desc:0 "在行星周围的恒星基地部署管理办公室模块，以提高官僚效率。"

sm_nanotechnology_lab:0 "纳米技术实验室"
sm_nanotechnology_lab_desc:0 "资源的实验性生产。"

sm_neutron_observatory:0 "中子星观测站"
sm_neutron_observatory_desc:0 "通过建造专门研究中子星的科学设施，我们的帝国肯定会在对社会的理解方面取得进步。"

sm_pulsar_observatory:0 "脉冲星观测站"
sm_pulsar_observatory_desc:0 "通过建造专门研究脉冲星的科学设施，我们的帝国肯定会在对工程学的理解方面取得进步。"

sm_social_services:0 "社会学"
sm_social_services_desc:0 "社会学模块将显着帮助简化本地和外国人的程序和需求。"

sm_storage_food:0 "食品储存"
sm_storage_food_desc:0 "食品模块有助于在困难时期保护和满足本地和外国人的饮食需求。"

sm_storage_minerals:0 "储物仓"
sm_storage_minerals_desc:0 "矿物模块将帮助本地矿业在困难时期保留原材料需求。"

sm_manufacturing_module:0 "制造"
sm_manufacturing_module_desc:0 "制造模块将帮助本地工厂保持稳定的贸易并满足人口需求。"

sm_unity_module:0 "凝聚力"
sm_unity_module_desc:0 "凝聚力模块是国家的象征，将帮助人民对他们的成就和扩张感到更自豪。"


sm_job_module:0 "就业办公室"
sm_job_module_desc:0 "恒星基地协调建筑，根据内置模块的专业知识帮助进行星球工作。"

sm_orbital_assembly:0 "生物动力加速器"
sm_orbital_assembly_desc:0 "恒星基地具有生产机械植入物和强大波束的能力，用于加速生物基因组，增强行星人口的生长和组装。"

sm_system_fast:0 "站点支持"
sm_system_fast_desc:0 "在系统中产生极端引力场的建筑。恒星基地将更加受到保护，以应对中子星、脉冲星、黑洞或其他复杂星系的环境变量。"

sm_orbital_ecology:0 "生态站"
sm_orbital_ecology_desc:0 "环境规划建筑和轨道生态适应，有助于改善适当利用行星表面进行人口和作物的实施。"

sm_management_building:0 "管理"
sm_management_building_desc:0 "负责有效管理和治理该地区行星系统的企业建筑。"

sm_research_lav:0 "科学实验室"
sm_research_lav_desc:0 "恒星基地研究实验室。"

sm_solar_panels:0 "太阳能电池板"
sm_solar_panels_desc:0 "产生能量。"

sm_space_housing:0 "住房模块"
sm_space_housing_desc:0 "在行星周围的环形中部署住宿模块，以增加人口。"

sm_star_gate:0 "$stargate$"
sm_star_gate_desc:0 "我们的恒星基地现在有了一个§S$stargate$§!，连接了我们帝国范围内的一系列星门，并设置了访问控制。"


 sm_refinery_exotic_gases:0 "异星天然气精炼厂"
sm_refinery_exotic_gases_desc:0 "借助纳米技术，我们可以从深处提取并精炼异星天然气，提高生产效率。"

sm_refinery_rare_crystals:0 "稀有水晶精炼厂"
sm_refinery_rare_crystals_desc:0 "借助纳米技术，我们可以从深处开采并精炼稀有水晶，提高生产效率。"

sm_refinery_volatile_motes:0 "易爆微粒精炼厂"
sm_refinery_volatile_motes_desc:0 "借助纳米技术，我们可以从深处开采并精炼易爆微粒，提高生产效率。"

sm_refinery_alloys:0 "合金精炼厂"
sm_refinery_alloys_desc:0 "借助纳米技术，我们可以从深处提取并精炼合金，提高生产效率。"

sm_refinery_living_metal:0 "活性金属精炼厂"
sm_refinery_living_metal_desc:0 "借助纳米技术，我们可以从深处提取并精炼活性金属，提高生产效率。"

sm_gatherers_living_metal:0 "活性金属收集器"
sm_gatherers_living_metal_desc:0 "专门的无人机在星系中收集恒星在事件地平线附近留下的活性金属提取物。"

sm_refinery_dark_matter:0 "暗物质精炼厂"
sm_refinery_dark_matter_desc:0 "借助纳米技术，我们可以从深处提取并精炼暗物质，提高生产效率。"

sm_gatherers_dark_matter:0 "暗物质收集器"
sm_gatherers_dark_matter_desc:0 "专门的无人机在星系中收集星球附近的事件地平线留下的暗物质提取物。"

sm_gatherers_production:0 "资源收集器"
